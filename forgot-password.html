<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Pulse.ai</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090a0f',
                        cardBg: '#131622',
                        cardBorder: '#1f2437',
                    }
                }
            }
        }
    </script>
    <style>
        /* فرض الخلفية والوضع الداكن فوراً لمنع أي وميض أبيض */
        html, body { background-color: #090a0f !important; color: #f1f5f9 !important; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center selection:bg-indigo-500 selection:text-white">

    <div class="max-w-md w-full mx-4 bg-cardBg border border-cardBorder p-8 rounded-2xl shadow-2xl">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center space-x-3 mb-4">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-500/30">P</div>
                <span class="text-xl font-bold tracking-tight text-white">Pulse<span class="text-indigo-400">.ai</span></span>
            </a>
            <h1 class="text-2xl font-bold text-white">Reset your password</h1>
            <p class="text-slate-400 text-sm mt-1">Enter your email address and we'll send you a recovery link</p>
        </div>

        <form class="space-y-4" onsubmit="event.preventDefault(); alert('Password reset instructions sent to your email.'); window.location.href='login.html';">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Email Address</label>
                <input type="email" required class="w-full bg-darkBg border border-cardBorder rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition" placeholder="name@company.com">
            </div>
            <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl transition shadow-lg shadow-indigo-600/30">Send Reset Instructions</button>
        </form>

        <p class="text-center text-sm text-slate-400 mt-6">
            Remembered your password? <a href="login.html" class="text-indigo-400 hover:underline font-medium">Sign in</a>
        </p>
        <div class="text-center mt-4">
            <a href="index.html" class="text-xs text-slate-500 hover:text-slate-300 transition">← Back to Home</a>
        </div>
    </div>

</body>
</html>
