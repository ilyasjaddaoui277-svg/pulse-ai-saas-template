<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support - Pulse.ai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090a0f',
                        cardBg: '#131622',
                        cardBorder: '#1f2437',
                    }
                }
            }
        }
    </script>
    <style>
        html, body { background-color: #090a0f !important; color: #f1f5f9 !important; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-darkBg/80 backdrop-blur-md border-b border-cardBorder">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-500/30">P</div>
                <span class="text-xl font-bold tracking-tight text-white">Pulse<span class="text-indigo-400">.ai</span></span>
            </div>
            
            <nav class="hidden md:flex items-center space-x-6 text-sm font-medium text-slate-300">
                <a href="index.html#home" class="hover:text-white transition">Home</a>
                <a href="features.html" class="hover:text-white transition">Features</a>
                <a href="pricing.html" class="hover:text-white transition">Pricing</a>
                <a href="contact.html" class="text-indigo-400 font-semibold">Contact</a>
            </nav>

            <div class="flex items-center space-x-4">
                <a href="login.html" class="text-sm font-medium text-slate-300 hover:text-white transition">Sign In</a>
                <a href="register.html" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-xl shadow-lg shadow-indigo-600/30 transition">Sign Up Free</a>
            </div>
        </div>
    </header>

    <!-- Contact Form Section -->
    <main class="py-24">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-12">
                <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold mb-4">
                    <span>24/7 Dedicated Assistance</span>
                </div>
                <h1 class="text-4xl font-extrabold text-white tracking-tight mb-4">Get in touch with our engineers</h1>
                <p class="text-slate-400 text-base">Have questions about enterprise infrastructure or custom multi-agent swarms? Send us a message.</p>
            </div>

            <div class="bg-cardBg border border-cardBorder p-8 sm:p-12 rounded-2xl shadow-xl">
                <form class="space-y-6" onsubmit="event.preventDefault(); alert('Message sent successfully. Our team will contact you shortly.');">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Your Name</label>
                            <input type="text" required class="w-full bg-darkBg border border-cardBorder rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition" placeholder="John Doe">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Email Address</label>
                            <input type="email" required class="w-full bg-darkBg border border-cardBorder rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition" placeholder="name@company.com">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Message</label>
                        <textarea rows="5" required class="w-full bg-darkBg border border-cardBorder rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition" placeholder="How can our infrastructure team help you?"></textarea>
                    </div>
                    <button type="submit" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl transition shadow-lg shadow-indigo-600/30">Send Message</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-darkBg border-t border-cardBorder py-12 text-center text-sm text-slate-500">
        <p>&copy; 2026 Pulse.ai. All rights reserved. Built for ThemeForest & Envato.</p>
    </footer>

</body>
</html>
